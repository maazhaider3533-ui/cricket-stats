<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cricket stats 🏏</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="players.html">Players</a>
            <a href="matches.html">Matches</a>
            <a href="rankings.html">Rankings</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>TEAM T VS TEAM H</h2>
            <p>Fated Rivals🔥🔥</p>
        </section>
        <section class="scoreboard">

            <h2>Head to Head</h2>

            <div class="score">
                <div class="team">
                    <h3>TEAM T</h3>
                    <p class="losing" id="teamTScore">--</p>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                    <h3>TEAM H</h3>
                    <p class="winning" id="teamHScore">--</p>
                </div>
            </div>

        </section>
        <section class="archive">
            <h2>Match History</h2>
            <div id="archiveContainer">
                <!-- filled in by JavaScript -->
            </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
